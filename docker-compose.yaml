services:
  db:
    image: postgres:15-alpine
    container_name: oneView
    restart: always
    profiles:
      - dev
      - prod
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-oneViewDB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7-alpine
    profiles:
      - dev
      - prod
    container_name: oneView_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: tirthoray10/oneView:latest
    restart: always
    profiles:
      - dev
      - prod
    # Remove container_name to allow scaling
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    expose:
      - '9097'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-myuser}:${DB_PASSWORD:-mypassword}@db:5432/${DB_NAME:-oneViewDB}
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      REDIS_CONNECTION_URL: redis://redis_cache:6379
    depends_on:
      db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    container_name: oneView_nginx
    restart: always
    profiles:
      - prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data:
